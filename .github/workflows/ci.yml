name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - uses: extractions/setup-just@v4
      - run: just build check test
